name: Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate package manifest
        run: |
          node -e "const p=require('./package.json'); if(!p.name || !p.version) throw new Error('missing name/version'); console.log('package:', p.name, p.version)"

      - name: Check npm package contents
        run: npm pack --dry-run
